name: Deploy Frontend to EC2

on:
  push:
    branches: [main]

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 600s
          script: |
            set -e

            echo "=== Frontend deployment started at $(date) ==="

            cd /var/www/lms-frontend

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Installing dependencies..."
            npm install

            echo ">>> Cleaning old build..."
            rm -rf .next

            echo ">>> Building..."
            npm run build

            echo ">>> Reloading PM2..."
            sudo pm2 reload lms-frontend || sudo pm2 restart lms-frontend || echo "WARNING: PM2 reload failed - check 'sudo pm2 list' for correct app name"

            sudo pm2 save

            sleep 3
            echo ">>> Health check..."
            curl -sf -o /dev/null -w "Frontend HTTP Status: %{http_code}\n" https://www.schaefer-tutoring.com/ || echo "WARNING: Frontend health check failed"

            echo "=== Frontend deployment completed at $(date) ==="